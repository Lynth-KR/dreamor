name: tests
# CI is for what is published: pushes to main and pull requests, or a run started by hand
# (workflow_dispatch) for a work branch. A change of Markdown alone builds nothing: README code
# blocks are compiled by tests/test_readme.cpp, which a change to them touches too.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
# A newer push to the same ref makes the run still going on the older one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stub:
    # The builds wait for format and tidy, the cheap checks that fail most: a run that fails
    # there costs those two jobs, not the whole matrix.
    # No CPLEX on CI: tests run against the Concert stub in tests/stub, with GCC and Clang -
    # the compile_fail cases check that both print our message first.
    # Real CPLEX: tests/run_tests.sh --cplex [CPLEX_Studio dir], locally.
    # -O3 -DNDEBUG is CMake's Release: GCC finds more with inlining, and asserts compile away.
    needs: [format, tidy]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-13, clang++-18]
        opt: ["-O1 -g", "-O3 -DNDEBUG"]
    steps:
      - uses: actions/checkout@v4
      - name: Clang 18
        if: matrix.cxx == 'clang++-18'
        run: command -v clang++-18 || (sudo apt-get update && sudo apt-get install -y clang-18)
      - run: CXX=${{ matrix.cxx }} OPT="${{ matrix.opt }}" tests/run_tests.sh

  sanitize:
    # The stub-mode tests under sanitizers, two builds: Address + UndefinedBehavior + Leak, and
    # Thread on its own (it cannot share a build with ASan) - tables on one set share its row
    # index across threads, behind a lock.
    needs: [format, tidy]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: ["1", thread]
    steps:
      - uses: actions/checkout@v4
      - run: CXX=g++-13 SAN=${{ matrix.san }} tests/run_tests.sh

  gcc-latest:
    # The compiler range: the stub job holds the floor (GCC 13, Clang 18), this job and
    # clang-latest the newest releases - bumped by hand at each major release (GCC every
    # spring, LLVM every March and September). The official image: Ubuntu 24.04 has no GCC 16.
    needs: [format, tidy]
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - run: CXX=g++ tests/run_tests.sh

  clang-latest:
    # The newest LLVM release, from apt.llvm.org (see gcc-latest).
    needs: [format, tidy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
      - run: CXX=clang++-23 tests/run_tests.sh

  mathopt:
    # The MathOpt backend against the OR-Tools C++ prebuilt, solving with HiGHS: unit tests,
    # the example, the Concert-vs-MathOpt comparison of the example's constraints, and the
    # MathOpt compile_fail cases.
    needs: [format, tidy]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-13, clang++-18]
    env:
      ORTOOLS_URL: https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Clang 18
        if: matrix.cxx == 'clang++-18'
        run: command -v clang++-18 || (sudo apt-get update && sudo apt-get install -y clang-18)
      - name: OR-Tools v9.15 prebuilt
        run: |
          mkdir -p "$RUNNER_TEMP/ortools"
          curl -sSfL "$ORTOOLS_URL" | tar xz -C "$RUNNER_TEMP/ortools" --strip-components=1
      - run: CXX=${{ matrix.cxx }} tests/run_tests.sh --mathopt "$RUNNER_TEMP/ortools"
      - name: CMake package with OR-Tools
        run: |
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --install "$RUNNER_TEMP/build"
          cmake -S tests/cmake_consumer_mathopt -B "$RUNNER_TEMP/consumer" -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix;$RUNNER_TEMP/ortools"
          cmake --build "$RUNNER_TEMP/consumer" -j4
          "$RUNNER_TEMP/consumer/lot_sizing"

  tidy:
    # clang-tidy at the version tools/tidy.sh pins, over the library, the tests and the examples.
    # OR-Tools' headers are needed to see the MathOpt backend; CPLEX is not, the stub stands in.
    runs-on: ubuntu-24.04
    env:
      ORTOOLS_URL: https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-tidy==23.1.3
      - name: OR-Tools v9.15 prebuilt
        run: |
          mkdir -p "$RUNNER_TEMP/ortools"
          curl -sSfL "$ORTOOLS_URL" | tar xz -C "$RUNNER_TEMP/ortools" --strip-components=1
      - run: ORTOOLS_DIR="$RUNNER_TEMP/ortools" python3 tools/gen_compile_commands.py
      - run: tools/tidy.sh

  format:
    # clang-format and ruff at the versions tools/format.sh and ruff.toml pin.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format==23.1.3 && pipx install ruff==0.17.1
      - run: tools/format.sh --check

  package:
    # The installed CMake package, taken the way a user would: find_package(dreamor), link
    # dreamor::dreamor, build, run - with both compilers.
    needs: [format, tidy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clang 18
        run: command -v clang++-18 || (sudo apt-get update && sudo apt-get install -y clang-18)
      - run: |
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --install "$RUNNER_TEMP/build"
          for cxx in g++-13 clang++-18; do
            cmake -S tests/cmake_consumer -B "$RUNNER_TEMP/consumer-$cxx" -DCMAKE_CXX_COMPILER=$cxx \
                  -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
            cmake --build "$RUNNER_TEMP/consumer-$cxx"
            "$RUNNER_TEMP/consumer-$cxx/consumer"
          done
