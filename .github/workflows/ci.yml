name: tests
# CI is for what is published: pushes to main and pull requests, or a run started by hand
# (workflow_dispatch) for a work branch. A change of Markdown alone builds nothing: the code
# blocks of the README and docs/guide.md are compiled by tests/test_readme.cpp, which a change to them touches too.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
# A newer push to the same ref makes the run still going on the older one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Every job takes under 5 minutes; one past 20 is stuck - on a package mirror that stopped
# answering, say - and would otherwise hold a runner for GitHub's default of six hours.
jobs:
  stub:
    # The builds wait for lint (format and tidy), the checks that fail most: a run that fails
    # there costs that job, not the whole matrix.
    # No CPLEX on CI: tests run against the Concert stub in tests/stub, with GCC and Clang -
    # the compile_fail cases check that both print our message first.
    # Real CPLEX: tests/run_tests.sh --cplex [CPLEX_Studio dir], locally.
    # -O3 -DNDEBUG is CMake's Release: GCC finds more with inlining, and asserts compile away.
    # GCC 13 at -O1 -g is sanitize (g++-13, 1): the same build, instrumented.
    # The compile_fail cases, the syntax checks and the tests of the documented code depend on
    # the compiler alone, not on OPT or SAN, so they run once per compiler (checks: 1) and
    # COMPILE_CHECKS=0 skips them elsewhere. Clang 18 at -O1 -g runs them alone (units: 0): its
    # other tests and contract_fail are sanitize (clang++-18, 1), the same build instrumented.
    # The g++-13 entry also installs the CMake package and builds tests/cmake_consumer through
    # find_package(dreamor), with both compilers, as a user would.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++-13, opt: "-O3 -DNDEBUG", checks: 1, units: 1 }
          - { cxx: clang++-18, opt: "-O1 -g", checks: 1, units: 0 }
          - { cxx: clang++-18, opt: "-O3 -DNDEBUG", checks: 0, units: 1 }
    steps:
      - uses: actions/checkout@v7
      - name: Clang 18
        run: command -v clang++-18 || (sudo apt-get update && sudo apt-get install -y clang-18)
      - run: >-
          CXX=${{ matrix.cxx }} OPT="${{ matrix.opt }}" COMPILE_CHECKS=${{ matrix.checks }}
          UNIT_TESTS=${{ matrix.units }} tests/run_tests.sh
      - name: CMake package
        if: matrix.cxx == 'g++-13'
        run: |
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --install "$RUNNER_TEMP/build"
          for cxx in g++-13 clang++-18; do
            cmake -S tests/cmake_consumer -B "$RUNNER_TEMP/consumer-$cxx" -DCMAKE_CXX_COMPILER=$cxx \
                  -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
            cmake --build "$RUNNER_TEMP/consumer-$cxx"
            "$RUNNER_TEMP/consumer-$cxx/consumer"
          done

  sanitize:
    # The stub-mode tests under sanitizers: Address + UndefinedBehavior + Leak, built by GCC and by
    # Clang, which instrument in ways of their own, and Thread on its own (it cannot share a build
    # with ASan) - tables on one set share its row index across threads, and lookups on several
    # threads build it once. The compile-time checks are the stub job's.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++-13, san: "1" }
          - { cxx: clang++-18, san: "1" }
          - { cxx: g++-13, san: thread }
    steps:
      - uses: actions/checkout@v7
      - name: Clang 18
        if: matrix.cxx == 'clang++-18'
        run: command -v clang++-18 || (sudo apt-get update && sudo apt-get install -y clang-18)
      - run: CXX=${{ matrix.cxx }} SAN=${{ matrix.san }} COMPILE_CHECKS=0 tests/run_tests.sh

  gcc-latest:
    # The compiler range: the stub job holds the floor (GCC 13, Clang 18), this job and
    # clang-latest the newest releases - bumped by hand at each major release (GCC every
    # spring, LLVM every March and September; an LLVM bump takes the clang-format and clang-tidy
    # pins along, AGENTS.md "Formatting"). The official image: Ubuntu 24.04 has no GCC 16.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: gcc:16
    steps:
      - uses: actions/checkout@v7
      - run: CXX=g++ tests/run_tests.sh

  clang-latest:
    # The newest LLVM release, from apt.llvm.org (see gcc-latest).
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
      - run: CXX=clang++-23 tests/run_tests.sh

  libcxx:
    # The standard library's range, as the compilers': LLVM's libc++ at the floor (Clang 18 and libc++ 18, Ubuntu
    # 24.04's) and the newest (from apt.llvm.org, bumped with clang-latest). What every supported standard library has
    # in common holds on it (AGENTS.md, "Platforms"). Unit tests and contract_fail; the compile_fail messages are the
    # compiler's, checked by the other jobs. Each runner is a fresh machine, so the two libc++ versions, whose
    # packages conflict, never meet; tools/ci_local.sh runs the newest in an image of its own.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        llvm: [18, 23]
    steps:
      - uses: actions/checkout@v7
      - name: LLVM ${{ matrix.llvm }} from apt.llvm.org
        if: matrix.llvm != 18
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ matrix.llvm }}
      - name: Clang and libc++ ${{ matrix.llvm }}
        run: >-
          sudo apt-get update && sudo apt-get install -y clang-${{ matrix.llvm }} libc++-${{ matrix.llvm }}-dev
          libc++abi-${{ matrix.llvm }}-dev libunwind-${{ matrix.llvm }}-dev
      - run: CXX=clang++-${{ matrix.llvm }} STDLIB=libc++ COMPILE_CHECKS=0 tests/run_tests.sh

  wasm:
    # WebAssembly (wasm32) with Emscripten, the tests run under Node.js: a 32-bit std::size_t and
    # libc++. It checks that dreamor builds and holds there, not how fast - performance is measured
    # on Linux x86-64 with libstdc++ alone. Emscripten has no long-term release, so one version is pinned, as
    # projects pin it; moving it is a tool update, not a bound of support.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: emscripten/emsdk:6.0.13
    steps:
      - uses: actions/checkout@v7
      - run: WASM=1 tests/run_tests.sh

  wasm-highs:
    # The HiGHS backend on WebAssembly: HiGHS built by the wasm job's Emscripten (tools/containers/build-highs-wasm.sh,
    # which the local CI's image runs too), kept in the cache by the script's content, and the HiGHS mode's tests,
    # example, compile_fail and contract_fail run under Node.js. A job of its own, so that HiGHS's build stays out of
    # the wasm job's result.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: emscripten/emsdk:6.0.13
    steps:
      - uses: actions/checkout@v7
      - name: HiGHS for wasm, from the cache
        id: highs
        uses: actions/cache@v6
        with:
          path: /opt/highs
          key: highs-wasm-emsdk-6.0.13-${{ hashFiles('tools/containers/build-highs-wasm.sh') }}
      - name: HiGHS for wasm, built
        if: steps.highs.outputs.cache-hit != 'true'
        run: sh tools/containers/build-highs-wasm.sh /opt/highs
      - run: WASM=1 tests/run_tests.sh --highs /opt/highs

  mathopt:
    # The MathOpt backend against the OR-Tools C++ prebuilt, solving with HiGHS: unit tests,
    # the example, the Concert-vs-MathOpt comparison of the example's constraints, and the
    # MathOpt compile_fail cases. Then the HiGHS backend on the HiGHS the prebuilt ships: its
    # tests, the README's code, its compile_fail and contract_fail cases.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-13, clang++-18]
    env:
      ORTOOLS_URL: https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz
    steps:
      - uses: actions/checkout@v7
      - name: Clang 18
        if: matrix.cxx == 'clang++-18'
        run: command -v clang++-18 || (sudo apt-get update && sudo apt-get install -y clang-18)
      - name: OR-Tools v9.15 prebuilt
        run: |
          mkdir -p "$RUNNER_TEMP/ortools"
          curl -sSfL "$ORTOOLS_URL" | tar xz -C "$RUNNER_TEMP/ortools" --strip-components=1
      - run: CXX=${{ matrix.cxx }} tests/run_tests.sh --mathopt "$RUNNER_TEMP/ortools"
      - run: CXX=${{ matrix.cxx }} tests/run_tests.sh --highs "$RUNNER_TEMP/ortools"
      - name: CMake package with OR-Tools
        run: |
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --install "$RUNNER_TEMP/build"
          cmake -S tests/cmake_consumer_mathopt -B "$RUNNER_TEMP/consumer" -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix;$RUNNER_TEMP/ortools"
          cmake --build "$RUNNER_TEMP/consumer" -j4
          "$RUNNER_TEMP/consumer/lot_sizing"

  lint:
    # clang-format and ruff at the versions tools/format.sh and ruff.toml pin, then clang-tidy at
    # the version tools/tidy.sh pins, over the library, the tests and the examples. OR-Tools'
    # headers are needed to see the MathOpt backend, and the HiGHS it ships the HiGHS backend; CPLEX
    # is not, the stub stands in.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORTOOLS_URL: https://github.com/google/or-tools/releases/download/v9.15/or-tools_amd64_ubuntu-24.04_cpp_v9.15.6755.tar.gz
    steps:
      - uses: actions/checkout@v7
      # The scripts run the pinned versions through uvx: the pins live in the scripts and ruff.toml alone.
      - run: pipx install uv
      - run: tools/format.sh --check
      - name: OR-Tools v9.15 prebuilt
        run: |
          mkdir -p "$RUNNER_TEMP/ortools"
          curl -sSfL "$ORTOOLS_URL" | tar xz -C "$RUNNER_TEMP/ortools" --strip-components=1
      - run: ORTOOLS_DIR="$RUNNER_TEMP/ortools" python3 tools/gen_compile_commands.py
      - run: tools/tidy.sh
